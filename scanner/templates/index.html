{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="input-box">

    <input id="target" placeholder="Target (IP / Domain)">
    <input id="start_port" placeholder="Start Port">
    <input id="end_port" placeholder="End Port">

    <select id="scan_type">
        <option value="custom">Custom Scan</option>
        <option value="quick">Quick Scan</option>
        <option value="full">Full Scan</option>
        <option value="stealth">Stealth Scan</option>
    </select>

    <button onclick="startScan()">⚡ EXECUTE</button>

    <a href="/download/" style="color:#00ff99;">
        Download Report
    </a>

</div>

<div class="progress">
    <div id="bar"></div>
</div>

<br>

<div id="console">
> System Ready and Waiting for Your Command .....
</div>

{% endblock %}
