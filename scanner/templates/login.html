<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Consolas, monospace;
            background: url("https://th.bing.com/th/id/OIP.hMzf3Wdt9or-3p1qDj0gSgHaEJ?w=312&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #00ff99;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.80);
            z-index: -1;
        }

        /* Login box */
        .login-box {
            width: 400px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #00ff99;
            border-radius: 15px;
            box-shadow: 0 0 25px #00ff99;
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 0 0 15px #00ff99;
        }

        form p {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            background: black;
            border: 1px solid #00ff99;
            color: #00ff99;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #00ff99;
            color: #00ff99;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00ff99;
            color: black;
            box-shadow: 0 0 20px #00ff99;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>⚡ LOGIN</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Secure Login</button>
    </form>
</div>

</body>
<footer class="footer">
    <p>     © 2026 All Rights Reserved | Designed & Developed by <strong>Shivam Pandey</strong></p>
</footer>
</html>
